plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cherunika.chernika'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cherunika.chernika'
        minSdk 30
        targetSdk 35
        versionCode 76
        versionName '7.6-hud-first-slim'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // The target tablet (Samsung SM-X115) is ARM64. Do not ship emulator
        // and 32-bit native libraries in this device-specific APK.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Unbundled Latin OCR: Google Play services downloads and maintains the
    // model instead of packaging a large native OCR pipeline in this APK.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.2'
    testImplementation 'junit:junit:4.13.2'
}
