[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chernika-rl"
version = "0.1.0"
description = "Offline reinforcement-learning harness for Chernika billiards aiming and power control"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "gymnasium>=1.0",
  "stable-baselines3[extra]>=2.6",
  "tensorboard>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["chernika_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
