name: Chernika SAC 100k training run

on:
  pull_request:
    paths:
      - 'training/**'
      - '.github/workflows/rl-train-100k.yml'

concurrency:
  group: chernika-sac-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: training/pyproject.toml
      - name: Install training package
        run: python -m pip install -e 'training[dev]'
      - name: Verify tests
        run: pytest -q training/tests
      - name: Train SAC for 100k shots
        working-directory: training
        run: |
          python -m chernika_rl.train --timesteps 100000 --eval-freq 10000 --eval-episodes 50 --device cpu --output artifacts/sac_single_ball
      - name: Evaluate against random and geometric baseline
        working-directory: training
        run: |
          python -m chernika_rl.evaluate --model artifacts/sac_single_ball/best_model/best_model.zip --episodes 200 --seed 20000 --output artifacts/sac_single_ball/heldout_evaluation.json
      - name: Upload trained policy and metrics
        uses: actions/upload-artifact@v4
        with:
          name: chernika-sac-100k
          path: training/artifacts/sac_single_ball/
          if-no-files-found: error
          retention-days: 30
