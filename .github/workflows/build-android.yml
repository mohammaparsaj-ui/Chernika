name: Build Chernika raw Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Chernika_Raw_Source.zip'
      - 'chernika-raw-source.zip'
      - 'build.trigger'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: chernika-raw-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand and validate source archive
        run: |
          set -euo pipefail
          if [ -f Chernika_Raw_Source.zip ]; then
            SOURCE_ARCHIVE=Chernika_Raw_Source.zip
          elif [ -f chernika-raw-source.zip ]; then
            SOURCE_ARCHIVE=chernika-raw-source.zip
          else
            echo "::error::Chernika source ZIP is missing from repository root."
            exit 1
          fi
          unzip -t "$SOURCE_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/chernika-source"
          unzip -oq "$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/chernika-source"
          test -f "$RUNNER_TEMP/chernika-source/settings.gradle"
          test -f "$RUNNER_TEMP/chernika-source/build.gradle"
          test -f "$RUNNER_TEMP/chernika-source/app/build.gradle"
          test -f "$RUNNER_TEMP/chernika-source/app/src/main/AndroidManifest.xml"
          echo "SOURCE_DIR=$RUNNER_TEMP/chernika-source" >> "$GITHUB_ENV"
          echo "Source archive passed ZIP integrity and Android project checks."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and assemble raw APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Chernika-Raw-Engine-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
