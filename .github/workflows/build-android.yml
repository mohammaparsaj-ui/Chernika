name: Build Chernika raw Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Chernika_Raw_Source.zip'
      - 'chernika-raw-source.zip'
      - 'build.trigger'
      - '.github/workflows/build-android.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: chernika-raw-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and validate Android project
        run: |
          set -euo pipefail
          if [ -f Chernika_Raw_Source.zip ]; then
            SOURCE_ARCHIVE=Chernika_Raw_Source.zip
          elif [ -f chernika-raw-source.zip ]; then
            SOURCE_ARCHIVE=chernika-raw-source.zip
          else
            SOURCE_ARCHIVE=""
          fi

          if [ -n "$SOURCE_ARCHIVE" ]; then
            unzip -t "$SOURCE_ARCHIVE"
            mkdir -p "$RUNNER_TEMP/chernika-source"
            unzip -oq "$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/chernika-source"
            SOURCE_DIR="$RUNNER_TEMP/chernika-source"
          elif [ -f settings.gradle ] && [ -f build.gradle ] && [ -f app/build.gradle ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
          else
            echo "::error::Neither a source ZIP nor a complete Android Gradle project was found."
            exit 1
          fi

          test -f "$SOURCE_DIR/settings.gradle"
          test -f "$SOURCE_DIR/build.gradle"
          test -f "$SOURCE_DIR/app/build.gradle"
          test -f "$SOURCE_DIR/app/src/main/AndroidManifest.xml"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Android project located and validated at $SOURCE_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Verify runner Gradle installation
        run: |
          gradle --version
          gradle --version | grep -q 'Gradle 9.8.2'

      - name: Run unit tests and assemble raw APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Chernika-Raw-Engine-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
