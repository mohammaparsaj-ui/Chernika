name: Chernika RL training tests

on:
  pull_request:
    paths:
      - 'training/**'
      - '.github/workflows/rl-tests.yml'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - '.github/workflows/rl-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: training/pyproject.toml
      - name: Install training package
        run: python -m pip install -e 'training[dev]'
      - name: Run tests
        run: pytest -q training/tests
