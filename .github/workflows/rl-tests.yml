name: Chernika RL training tests

on:
  pull_request:
    paths:
      - 'training/**'
      - '.github/workflows/rl-tests.yml'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - '.github/workflows/rl-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: training/pyproject.toml
      - name: Install training package
        run: python -m pip install -e 'training[dev]'
      - name: Run tests
        run: pytest -q training/tests
      - name: Smoke-train SAC and run benchmark
        working-directory: training
        run: |
          python -m chernika_rl.train --timesteps 6000 --eval-freq 3000 --eval-episodes 10 --output /tmp/chernika-rl-ci
          python -m chernika_rl.evaluate --model /tmp/chernika-rl-ci/best_model/best_model.zip --episodes 10 --output /tmp/chernika-rl-ci/evaluation.json
