name: Chernika teacher-guided imitation training

on:
  pull_request:
    paths:
      - 'training/**'
      - '.github/workflows/rl-teacher-imitation.yml'
  workflow_dispatch:

concurrency:
  group: chernika-imitation-pr
  cancel-in-progress: true

jobs:
  teacher-imitation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: training/pyproject.toml
      - name: Install training package
        run: python -m pip install -e 'training[dev]'
      - name: Run unit tests
        run: pytest -q training/tests
      - name: Generate 4,000 teacher demonstrations
        working-directory: training
        run: |
          python -m chernika_rl.generate_teacher_data --states 4000 --seed 40000 --output artifacts/teacher_dataset.npz
      - name: Train imitation policy
        working-directory: training
        run: |
          python -m chernika_rl.train_imitation --data artifacts/teacher_dataset.npz --epochs 80 --batch-size 128 --seed 123 --output artifacts/imitation_policy.pt
      - name: Evaluate on 300 held-out states
        working-directory: training
        run: |
          python -m chernika_rl.evaluate_imitation --model artifacts/imitation_policy.pt --episodes 300 --seed 60000 --output artifacts/imitation_evaluation.json
      - name: Upload dataset, model and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: chernika-teacher-imitation
          path: |
            training/artifacts/teacher_dataset.npz
            training/artifacts/teacher_dataset.json
            training/artifacts/imitation_policy.pt
            training/artifacts/imitation_policy.metrics.json
            training/artifacts/imitation_evaluation.json
          if-no-files-found: error
          retention-days: 30
