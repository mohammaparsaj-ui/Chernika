name: Validate Plato 9-ball dataset

on:
  push:
    branches: [main, data/plato-recordings-v1]
    paths:
      - 'training/datasets/plato-9ball-v1/**'
      - '.github/workflows/validate-plato-dataset.yml'
  pull_request:
    paths:
      - 'training/datasets/plato-9ball-v1/**'
      - '.github/workflows/validate-plato-dataset.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate annotations and split integrity
        run: python training/datasets/plato-9ball-v1/validate_dataset.py
