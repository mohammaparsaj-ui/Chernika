name: Chernika AI Android preview APK

on:
  push:
    branches: [feature/chernika-ai-android-v0]
    paths:
      - 'assistant-android/**'
      - '.github/workflows/chernika-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Chernika AI preview
        working-directory: assistant-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Chernika-AI-Preview-APK
          path: assistant-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
