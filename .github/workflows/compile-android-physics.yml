name: Chernika Android physics compile check

on:
  pull_request:
    branches:
      - feature/rl-aim-training-v1
      - rebuild/table-simulator-gameplay
    paths:
      - 'app/src/main/java/com/cherunika/chernika/PoolPhysics.java'
      - 'app/src/main/java/com/cherunika/chernika/NineBallRules.java'
      - 'app/src/main/java/com/cherunika/chernika/PlatoTableCalibration.java'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/compile-android-physics.yml'
  workflow_dispatch:

concurrency:
  group: chernika-android-physics-compile
  cancel-in-progress: true

jobs:
  compile-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" "platform-tools"
      - name: Verify Gradle
        run: gradle --version
      - name: Compile Java and run Android unit tests
        run: |
          gradle :app:testDebugUnitTest :app:compileDebugJavaWithJavac --no-daemon --stacktrace
