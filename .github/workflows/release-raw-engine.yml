name: Publish Chernika native engine APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-raw-engine.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'build.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernika-native-engine-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Verify Gradle
        run: |
          gradle --version
          gradle --version | grep -q 'Gradle 9.8.2'

      - name: Run tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Chernika-Raw-Engine-0.1.0.apk
          sha256sum Chernika-Raw-Engine-0.1.0.apk > Chernika-Raw-Engine-0.1.0.sha256
          test -s Chernika-Raw-Engine-0.1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: raw-engine-v0.1.0
          name: Chernika Native Engine 0.1.0
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            Chernika-Raw-Engine-0.1.0.apk
            Chernika-Raw-Engine-0.1.0.sha256
