name: Chernika neural action and physics guard Android tests

on:
  push:
    branches:
      - feature/nineball-neural-action-guard-v1
    paths:
      - 'app/src/main/java/com/cherunika/chernika/ShotPlanner.java'
      - 'app/src/main/java/com/cherunika/chernika/NineBallImitationPolicy.java'
      - 'app/src/test/java/com/cherunika/chernika/ShotPlannerNeuralActionTest.java'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-neural-action-check.yml'

concurrency:
  group: chernika-neural-action-android-check
  cancel-in-progress: true

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" "platform-tools"
      - name: Compile Android and run unit tests
        run: gradle :app:testDebugUnitTest :app:compileDebugJavaWithJavac --no-daemon --stacktrace
