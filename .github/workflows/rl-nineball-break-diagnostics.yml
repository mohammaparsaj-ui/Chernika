name: Chernika nine-ball break diagnostics

on:
  pull_request:
    paths:
      - 'training/chernika_rl/diagnose_nine_ball_break.py'
      - 'training/chernika_rl/physics.py'
      - 'app/src/main/java/com/cherunika/chernika/PoolPhysics.java'
      - '.github/workflows/rl-nineball-break-diagnostics.yml'
  workflow_dispatch:

concurrency:
  group: chernika-break-diagnostics-pr
  cancel-in-progress: true

jobs:
  diagnose-break:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: training/pyproject.toml
      - name: Install training package
        run: python -m pip install -e 'training[dev]'
      - name: Diagnose candidate angles and power
        working-directory: training
        run: |
          python -m chernika_rl.diagnose_nine_ball_break --racks 20 --seed 90900 --output artifacts/nine_ball_break_diagnostic.json
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: chernika-nineball-break-diagnostic
          path: training/artifacts/nine_ball_break_diagnostic.json
          if-no-files-found: error
          retention-days: 30
